name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@50e7c2dbdb7f1430986ef67760fc9c790c9e4e31
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      post-check: |
        pnpm run build
        pnpm run check:privacy
        test -f dist/index.html
        test -f dist/llms.txt
        test -f dist/_headers
        test -f dist/favicon.svg
        test -f dist/apple-touch-icon.png
        pnpm run verify:preview
        SOURCE_DATE_EPOCH=315532800 python -X utf8 scripts/package_release.py snapshot
        (cd artifact && sha256sum --check SHA256SUMS)
